name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        run: ./gradlew spotlessCheck --stacktrace

      - name: Lint
        run: ./gradlew :hanfts:lintRelease --stacktrace

      - name: Build
        run: ./gradlew :hanfts:assembleRelease --stacktrace
